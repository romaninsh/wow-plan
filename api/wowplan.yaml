# yaml-language-server: $schema=./api-schema-1.json
title: wow-plan
description: >
  wow-plan.com: personal leveling plans for World of Warcraft: Forever, and the game data they
  refer to (items, quests, zones, areas, dungeons, skills and professions of one client build).
  A plan is opened by its 7-character id (the link someone shared); there is no list of plans.
  create_plan, unlock_plan and plan_access return the plan's page as url: give the player that
  link, don't build one. A plan has one or two characters (plan_characters), level brackets (plan_blocks) and targets,
  the player's own goals (plan_targets), each read under its plan (parent_id). Anyone with the
  id reads a plan. Changing it needs its 4-character edit key: unlock_plan with the key unlocks
  it in this session, and every change to a locked plan is refused. Find game records by name
  with find_game_data, then read one with get_items, get_zones, get_areas, get_dungeons or
  get_skill_lines. Records are read-only; a plan changes through its actions, which check every
  field against the game data and the plan. Every target sits in a level bracket, and a new plan
  has none: add_block (plan_id, min_level, max_level, title?) first, remove_block to drop an
  empty one. Then add_target, update_target, move_target, remove_target, tick_todo and
  set_target_notes. The data names things and their levels; it never says what is best, and it
  has no drop sources: leave those to the player or to the target's notes.

  When you plan for a player: a plan is a short list of goals, not a walkthrough; exploring and
  asking other players is the point of the game. Add the fewest to-dos that get them there, one
  per zone to level in rather than one per quest. A to-do about an item, zone, dungeon, quest or
  recipe is that kind, linked by ref (an object, { item_id: 5191 }); note is only for a goal
  with no game record. Leave notes out unless they say something the player can't see on the
  page or find by playing; one short sentence. If a linked to-do is refused and you can't see
  why, say so to the player instead of adding it as a note. A longer guide is the
  wow-plan-planner skill, at /agent-skills/wow-plan-planner/SKILL.md on this site.

entities:
  # ── guides (MongoDB) ─────────────────────────────────────────────────────────
  # A plan is read by its link only; its parts only under it (agents/BRIEF.md "Sessions and
  # unlock"). Writes go through the plans datasource's rule: only plans this session unlocked.
  - name: plans
    observe: plan
    read_only: true
    params:
      # edit_code_hash is deliberately not listed
      columns: [name, description, game_build, forked_from, side, created_at, updated_at]
    api: { list: false }

  - name: plan_characters
    observe: plan_character
    read_only: true
    params:
      columns: [plan_id, key, order, name, race_id, race_name, class_id, class_name, professions, start, notes]
      filter: [plan_id]
      default_sort: order
    api: { via: plans }

  - name: plan_blocks
    observe: plan_block
    read_only: true
    params:
      columns: [plan_id, order, title, min_level, max_level, zones, notes]
      filter: [plan_id]
      default_sort: order
    api: { via: plans }

  # Changed only through the target actions (below), which check their input; the plans
  # datasource's rule refuses them on a plan this session didn't unlock.
  - name: plan_targets
    observe: plan_target
    read_only: true
    params:
      columns: [plan_id, block_id, order, kind, title, characters, ref, place, count, level, purpose, for_character, done, done_at, notes]
      filter: [plan_id, block_id, kind]
      default_sort: order
    api: { via: plans }

  # ── game data (Postgres), looked up by id on hover ───────────────────────────
  - name: items
    observe: item
    read_only: true
    params:
      columns: [name, quality, quality_name, item_level, required_level, item_class_name, item_subclass_name,
                inventory_type, slot_name, armor_type, binding_name, armor, damage_min, damage_max,
                weapon_speed_ms, dps, usable_by_classes, required_skill_name, required_skill_rank,
                item_set_id, item_set_name, sell_price_text, description, build, faction_side,
                required_faction_name, required_standing_name, required_pvp_rank]
      filter: [item_set_id, quality, slot_name, faction_side]
      default_sort: name

  - name: item_stats
    observe: item_stat
    read_only: true
    params:
      columns: [item_id, slot, stat, label, tooltip_kind, value]
      filter: [item_id]
      default_sort: slot

  - name: item_spells
    observe: item_spell
    read_only: true
    params:
      columns: [item_id, spell_id, spell_name, trigger, spell_description]
      filter: [item_id]
      default_sort: spell_id

  # Where an item comes from, as far as the client data says: crafted, quest reward or choice,
  # reputation, PvP rank. Creature drops and vendors aren't in any source yet.
  - name: item_sources
    observe: item_source
    read_only: true
    params:
      columns: [item_id, item_name, kind, source_id, source_name, detail, recipe_spell_id, quest_id,
                faction_id, zone_id, zone_name]
      filter: [item_id, kind, quest_id, zone_id]
      default_sort: kind

  - name: enchants
    observe: enchant
    read_only: true
    params:
      columns: [name, effect_text, kind, applies_to, profession_name, skill_required, taught_by_item_id,
                taught_by_item_name, item_id, item_name, item_required_level, duration_s, charges,
                description]
      filter: [item_id, taught_by_item_id, profession_name, kind]
      default_sort: name

  - name: quests
    observe: quest
    read_only: true
    params:
      columns: [name, quest_level, min_level, zone_id, zone_name, category_name, quest_type_name,
                next_quest_id, objectives, description, reward_xp, reward_item_count, reward_choice_count]
      filter: [zone_id]
      default_sort: name

  - name: quest_items
    observe: quest_item
    read_only: true
    params:
      columns: [quest_id, quest_name, role, item_id, item_name, item_quality, count]
      filter: [quest_id, item_id, role]
      default_sort: quest_name

  - name: zones
    observe: zone
    read_only: true
    params:
      columns: [name, kind, map_name, min_level, max_level, level_source, sub_area_count, quest_count]
      filter: [kind]
      default_sort: name

  - name: areas
    observe: area
    read_only: true
    params:
      columns: [name, parent_name, zone_id, zone_name, map_name, exploration_level]
      filter: [zone_id]
      default_sort: name

  - name: dungeons
    observe: dungeon
    read_only: true
    params:
      columns: [name, kind, map_name, max_players, min_level, max_level, level_source]
      filter: [kind]
      default_sort: name

  - name: skill_lines
    observe: skill_line
    read_only: true
    params:
      columns: [name, category, recipe_count, is_craft, description]
      filter: [category]
      default_sort: name

  - name: class_race_combos
    observe: class_race_combo
    read_only: true
    params:
      columns: [label, race_id, race_name, class_id, class_name, side]
      filter: [side, race_id, class_id]
      default_sort: label
    api: { load: instant }

  - name: build_info
    observe: build_info
    read_only: true
    params:
      columns: [product, fetched_at, imported_at]
    api: { load: instant }

# The target actions carry their own copy of resolve_target's checks: an API body can't call
# another script action (VAN-546).
actions: [create_plan, unlock_plan, lock_plan, plan_access, rotate_edit_key,
          add_block, remove_block,
          add_target, update_target, move_target, remove_target, tick_todo, set_target_notes,
          find_game_data]

# Per caller (an anonymous visitor or agent counts by its address): every MCP tool call and
# every action invoke over the socket, whichever action; reads over the socket aren't counted.
# Each write action has a stricter one of its own (unlock_plan, create_plan, the target actions).
rate_limit: { per_second: 10, burst: 120 }

# Cloud Run reached directly appends the caller's address to X-Forwarded-For; 2 behind a Google
# load balancer (docs/deploy.md). Locally there's no header and the socket's peer is used.
trust_forwarded: true

# Every caller gets an anonymous session (application.yaml `session:`), with no sign-in; what it
# may change is the plans datasource's rule. check_edit_code is the desktop's now: the page
# unlocks instead.
auth:
  local: session
  prod: session

# The same API for AI agents, over MCP at /mcp on the API's own port (one Cloud Run service,
# one process: agents and browsers share sessions, revokes and rate limits; docs/deploy.md).
mcp: { mount: main }
