  - { name: two_handed_maces_skill, label: "Two-Handed Maces Skill", type: int }
  - { name: two_handed_swords_skill, label: "Two-Handed Swords Skill", type: int }
  - { name: axes_skill, label: "Axes Skill", type: int }
