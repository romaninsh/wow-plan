  - { name: fishing_skill, label: "Fishing", type: int }
  - { name: fire_penetration, label: "Fire Penetration", type: int }
  - { name: frost_penetration, label: "Frost Penetration", type: int }
  - { name: all_resistance, label: "All Resistances", type: int }
