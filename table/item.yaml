  - { name: spell_penetration, label: "Spell Penetration", type: int }
  - { name: block_value, label: "Block Value", type: int }
  - { name: bonus_armor, label: "Bonus Armor", type: int }
  - { name: fire_resistance, label: "Fire Resistance", type: int }
  - { name: frost_resistance, label: "Frost Resistance", type: int }
  - { name: holy_resistance, label: "Holy Resistance", type: int }
  - { name: shadow_resistance, label: "Shadow Resistance", type: int }
  - { name: nature_resistance, label: "Nature Resistance", type: int }
