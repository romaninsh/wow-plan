# yaml-language-server: $schema=./table-schema-1.json
# Every named item of the imported build. Stat columns mirror seeds/ref_item_stat_types.csv:
# add a column here when a row is added there.
datasource: wow
title: Items
table: items
columns:
  - { name: item_id, label: ID, type: int, flags: [id, searchable] }
  - { name: name, label: Name, type: string, flags: [title, searchable, mandatory] }
  - { name: quality, label: Quality, type: int }
  - { name: quality_name, label: Quality name, type: string }
  - { name: item_level, label: Item level, type: int }
  - { name: required_level, label: Required level, type: int }
  - { name: item_class_id, label: Class ID, type: int }
  - { name: item_class_name, label: Class, type: string }
  - { name: item_subclass_id, label: Subclass ID, type: int }
  - { name: item_subclass_name, label: Type, type: string }
  - { name: inventory_type, label: Slot ID, type: int }
  - { name: slot_name, label: Slot, type: string }
  - { name: armor_type, label: Armor type, type: string }
  - { name: binding, label: Binding ID, type: int }
  - { name: binding_name, label: Binding, type: string }
  - { name: max_stack, label: Stack, type: int }
  - { name: armor, label: Armor, type: int }
  - { name: damage_min, label: Damage min, type: int }
  - { name: damage_max, label: Damage max, type: int }
  - { name: weapon_speed_ms, label: Speed (ms), type: int }
  - { name: dps, label: DPS, type: float }
  - { name: mana, label: "Mana", type: int }
  - { name: health, label: "Health", type: int }
  - { name: agility, label: "Agility", type: int }
  - { name: strength, label: "Strength", type: int }
  - { name: intellect, label: "Intellect", type: int }
  - { name: spirit, label: "Spirit", type: int }
  - { name: stamina, label: "Stamina", type: int }
  - { name: defense_rating, label: "Defense Rating", type: int }
