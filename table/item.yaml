  - { name: required_skill_rank, label: Required skill rank, type: int }
  - name: item_set_id
    label: Set
    type: int
    references: { table: item_set, kind: has_one, name: item_set }
  - { name: item_set_name, label: Set name, type: string }
  - { name: starts_quest_id, label: Starts quest, type: int }
  - { name: sell_price_copper, label: Sell price (copper), type: int }
  - { name: sell_price_text, label: Sell price, type: string }
  - { name: buy_price_copper, label: Buy price (copper), type: int }
  - { name: description, label: Description, type: string }
  - { name: build, label: Build, type: string }
references:
  spells: { table: item_spell, kind: has_many, foreign_key: item_id }
  stats: { table: item_stat, kind: has_many, foreign_key: item_id }
  made_by: { table: recipe, kind: has_many, foreign_key: creates_item_id }
  used_in: { table: recipe_reagent, kind: has_many, foreign_key: item_id }
  teaches: { table: recipe, kind: has_many, foreign_key: taught_by_item_id }
  quests: { table: quest_item, kind: has_many, foreign_key: item_id }
  sources: { table: item_source, kind: has_many, foreign_key: item_id }
  applies_enchants: { table: enchant, kind: has_many, foreign_key: item_id }
  teaches_enchants: { table: enchant, kind: has_many, foreign_key: taught_by_item_id }
