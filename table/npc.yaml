# yaml-language-server: $schema=./table-schema-1.json
# Creatures from players' client caches (opendata): only those someone has seen so far.
datasource: wow
title: NPCs
table: npcs
columns:
  - { name: npc_id, label: ID, type: int, flags: [id, searchable] }
  - { name: name, label: Name, type: string, flags: [title, searchable] }
  - { name: subname, label: Title, type: string, flags: [searchable] }
  - { name: creature_type_name, label: Type, type: string }
  - { name: classification_name, label: Rank, type: string }
  - { name: confidence, label: Confidence, type: string }
  - { name: build_last_seen, label: Seen in build, type: string }
