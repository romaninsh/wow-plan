# yaml-language-server: $schema=./table-schema-1.json
# A guide. _id is the 7-character share id (wow-plan.com/<id>). Schema: mongo/schema.js.
datasource: plans
title: Plans
table: plans
columns:
  - { name: _id, label: Link ID, type: string, flags: [id, searchable] }
  - { name: name, label: Plan, type: string, flags: [title, searchable, mandatory] }
  - { name: description, label: Description, type: string, flags: [searchable] }
  - { name: game_build, label: Game build, type: string }
  - { name: side, label: Side, type: string, enum: [Alliance, Horde] }
  # SHA-256 of the edit code; never exposed through the API
  - { name: edit_code_hash, label: Edit code hash, type: string, flags: [hidden] }
  - name: forked_from
    label: Cloned from
    type: string
    references: { table: plan, kind: has_one, name: original }
  # true on the plans mongo/seed.js owns: Reset sample plans reloads these and no others
  - { name: sample, label: Sample, type: bool, flags: [calculated] }
  - { name: created_at, label: Created, type: timestamp, time_precision: minutes, flags: [calculated] }
  - { name: updated_at, label: Updated, type: timestamp, time_precision: minutes, flags: [calculated] }
# No has_many to characters, brackets or to-dos: those are only ever shown for one plan, on its
# own pages (Plan, Brackets, To-dos), never as a related list that could be opened on its own.
references:
  clones: { table: plan, kind: has_many, foreign_key: forked_from }
