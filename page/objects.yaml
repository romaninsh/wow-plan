# yaml-language-server: $schema=./page-schema-1.json
title: Objects
body:
  - kind: binder
    name: objects
    observe: game_object
    params:
      allow_add: false
      default_sort: { column: name, direction: asc }
      filter: [required_skill_name, ">required_skill_rank"]
      columns:
        name: { label: Object, width: 280, pin: true }
        required_skill_name: { label: Needs skill, width: 120 }
        required_skill_rank: { label: Skill rank, width: 80 }
        object_type: { label: Type, width: 60 }
        object_id: { label: ID, width: 70 }
