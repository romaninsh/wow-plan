# yaml-language-server: $schema=./page-schema-1.json
title: Objects
body:
  - kind: binder
    name: objects
    observe: game_object
    params:
      allow_add: false
      default_sort: { column: name, direction: asc }
      columns:
        object_id: { label: ID, width: 70 }
        name: { label: Name, width: 280, pin: true }
        object_type: { label: Type, width: 70 }
        required_skill_id:
          label: Needs skill
          labels: { "182": Herbalism, "186": Mining, "633": Lockpicking }
        required_skill_rank: { label: Rank, width: 60 }
