# yaml-language-server: $schema=./page-schema-1.json
title: Spells
body:
  - kind: binder
    name: spells
    observe: spell
    params:
      allow_add: false
      default_sort: { column: spell_id, direction: asc }
      filter: [school_name, skill_name, ">spell_level"]
      columns:
        name: { label: Spell, width: 240, pin: true }
        rank: { label: Rank, width: 80 }
        school_name:
          label: School
          width: 90
          color: { yellow: [Holy], red: [Fire], green: [Nature], cyan: [Frost], magenta: [Shadow, Arcane] }
        spell_level: { label: Level, width: 60 }
        skill_name: { label: Skill, width: 130 }
        description: { label: Description, width: 460 }
        spell_id: { label: ID, width: 70 }
