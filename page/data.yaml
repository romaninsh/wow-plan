# yaml-language-server: $schema=./page-schema-1.json
title: Data
body:
  - kind: row
    children:
      - kind: stat
        observe: build_info
        params: { label: Live build, column: build, icon: Database, color: blue }
      - kind: stat
        observe: build_info
        params: { label: Tables fetched, column: fetched_at, icon: Download }
      - kind: stat
        observe: build_info
        params: { label: Imported, column: imported_at, icon: RefreshCw }
      - kind: stat
        observe: item
        params: { label: Items, icon: Gem }
  # which databases the buttons below act on: TARGET in the active profile's env file
  - kind: label
    when: 'profile.target == "prod"'
    params: { text: "Profile prod: Import build and the guides buttons change PRODUCTION (Cloud SQL and Atlas).", icon: TriangleAlert, style: heading }
  - kind: label
    when: 'profile.target != "prod"'
    params: { text: "Profile ${profile.target}: the buttons below act on the local databases.", style: muted }
  - kind: row
    children:
      - kind: button
        params:
          label: "Fetch build"
          icon: Download
          # language=rhai
          action: |
            actions.fetch_build();
      - kind: button
        params:
          label: "Import build"
          icon: RefreshCw
          style: primary
          # language=rhai
          action: |
            actions.import_build(#{ target: profile.target, build: "" });
      - kind: button
        params:
          label: "Roll back import"
          icon: Undo2
          # language=rhai
          action: |
            actions.rollback_import(#{ target: profile.target });
      - kind: button
        params:
          label: "Update guides schema"
          icon: Settings2
          # language=rhai
          action: |
            actions.update_guides_schema(#{ target: profile.target });
      - kind: button
        params:
          label: "Setup guide"
          icon: Play
          # language=rhai
          action: |
            actions.setup();
  - kind: markdown
    text: |
      **Fetch build** downloads the game's data tables for a Forever client build from
      wago.tools, with hotfixes merged, into `refs/wago/<build>/`. Files already there are kept.
      To pick up newer hotfixes for a table, delete its file and fetch again.

      **Import build** rebuilds this database from a fetched build: it transforms and tests the
      data, then swaps the new tables in. If a test fails nothing changes and the terminal says
      why. The previous build stays in schema `wow_prev` for one import.

      **Roll back import** puts that previous import back live in one step (a second click
      undoes it): the quick way out when a new client build turns out broken. To go further
      back, **Re-import** an older run on the Import history page; it rebuilds from that build's
      fetched files with today's transforms and the current opendata.

      Quests, NPCs and objects come from players' game caches (the opendata project) and only
      cover what someone has seen so far. Every import and rollback is listed on the
      **Import history** page.
