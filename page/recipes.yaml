# yaml-language-server: $schema=./page-schema-1.json
title: Recipes
body:
  - kind: binder
    name: recipes
    observe: recipe
    params:
      allow_add: false
      default_sort: { column: skill_required, direction: asc }
      filter: [skill_id, ">skill_required"]
      columns:
        recipe_spell_id: { label: ID, width: 70 }
        name: { label: Recipe, width: 260, pin: true }
        skill_id:
          label: Profession
          labels: { "40": Poisons, "129": First Aid, "164": Blacksmithing, "165": Leatherworking, "171": Alchemy, "185": Cooking, "186": Mining, "197": Tailoring, "202": Engineering, "333": Enchanting, "393": Skinning }
        skill_required: { label: Skill, width: 60 }
        skill_green: { label: Green, width: 60, color: { green: [">0"] } }
        skill_gray: { label: Gray, width: 60, color: { muted: [">0"] } }
        creates: { label: Creates, width: 160 }
        reagents: { label: Reagents, width: 300 }
