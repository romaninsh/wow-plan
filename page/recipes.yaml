# yaml-language-server: $schema=./page-schema-1.json
title: Recipes
body:
  - kind: binder
    name: recipes
    observe: recipe
    params:
      allow_add: false
      default_sort: { column: skill_green, direction: asc }
      filter: [profession_name, ">skill_green", ">creates_item_required_level"]
      columns:
        name: { label: Recipe, width: 240, pin: true }
        profession_name: { label: Profession, width: 120 }
        skill_green: { label: Green at, width: 70, color: { green: [">0"] } }
        skill_gray: { label: Gray at, width: 65, color: { muted: [">0"] } }
        creates_item_name: { label: Creates, width: 200 }
        creates_item_quality:
          label: Quality
          width: 80
          labels: { "0": Poor, "1": Common, "2": Uncommon, "3": Rare, "4": Epic, "5": Legendary, "6": Artifact, "7": Heirloom }
          color: { muted: ["0"], green: ["2"], blue: ["3"], magenta: ["4"], yellow: ["5", "6", "7"] }
        creates_item_required_level: { label: Use level, width: 70 }
        creates_count: { label: Makes, width: 55 }
        reagent_count: { label: Reagents, width: 70 }
        taught_by_item_name: { label: Taught by, width: 200 }
        recipe_spell_id: { label: ID, width: 70 }
