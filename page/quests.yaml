# yaml-language-server: $schema=./page-schema-1.json
title: Quests
body:
  - kind: binder
    name: quests
    observe: quest
    params:
      allow_add: false
      default_sort: { column: quest_level, direction: asc }
      filter: [category_name, quest_type_name, ">quest_level", ">min_level"]
      columns:
        name: { label: Quest, width: 240, pin: true }
        quest_level: { label: Level, width: 60 }
        min_level: { label: Min, width: 55 }
        category_name: { label: Zone or category, width: 160 }
        quest_type_name: { label: Type, width: 80 }
        objectives: { label: Objectives, width: 380 }
        reward_xp: { label: XP, width: 70 }
        quest_id: { label: ID, width: 70 }
