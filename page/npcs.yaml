# yaml-language-server: $schema=./page-schema-1.json
title: NPCs
body:
  - kind: binder
    name: npcs
    observe: npc
    params:
      allow_add: false
      default_sort: { column: name, direction: asc }
      filter: [creature_type_name, classification_name]
      columns:
        name: { label: Name, width: 240, pin: true }
        subname: { label: Title, width: 200 }
        creature_type_name: { label: Type, width: 110 }
        classification_name:
          label: Rank
          width: 100
          color: { yellow: [Elite, Boss], blue: [Rare, Rare Elite] }
        build_last_seen: { label: Seen in build, width: 110 }
        npc_id: { label: ID, width: 70 }
