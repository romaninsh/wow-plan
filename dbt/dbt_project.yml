name: wow_db
version: "0.2.0"
config-version: 2
profile: wow_db

model-paths: ["models"]
# Our own data lives in the repo's top-level seeds/ folder (see seeds/README.md).
seed-paths: ["../seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Raw inputs, relative to this folder. The pipeline passes wago_build for the build it imports.
  opendata_dir: "../refs/opendata/data/client"
  wago_dir: "../refs/wago"
  wago_build: "1.60.1.70532"

models:
  wow_db:
    # Staging: one view per raw file, renamed and typed. DuckDB only.
    staging:
      +materialized: view
      +schema: staging
    # Intermediate: computed values and joins shared by several marts. DuckDB only.
    intermediate:
      +materialized: view
      +schema: intermediate
    # Marts: the published data set. Built as DuckDB tables, then copied into Postgres
    # schema `wow` by `dbt run-operation publish_postgres` (pipeline/pipeline.py import).
    marts:
      +materialized: table

seeds:
  wow_db:
    +schema: ref
