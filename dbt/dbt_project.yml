name: wow_db
version: "0.1.0"
config-version: 2
profile: wow_db

model-paths: ["models"]
# Our own data lives in the repo's top-level seeds/ folder (see seeds/README.md).
seed-paths: ["../seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Raw inputs, relative to this folder. Bump wago_build after fetching a newer build into refs/wago/.
  opendata_dir: "../refs/opendata/data/client"
  wago_dir: "../refs/wago"
  wago_build: "1.60.1.70532"

models:
  wow_db:
    # Staging: one view per raw file, renamed and typed. Lives in data/wow.duckdb.
    staging:
      +materialized: view
      +schema: staging
    # Intermediate: joins and unnesting shared by several marts. Also in data/wow.duckdb.
    intermediate:
      +materialized: view
      +schema: intermediate
    # Marts: the published data set. Built as tables in data/wow.duckdb, then copied into
    # data/wow.sqlite by the publish_sqlite() hook at the end of every run.
    marts:
      +materialized: table

seeds:
  wow_db:
    +schema: ref

on-run-end:
  - "{{ publish_sqlite() }}"
