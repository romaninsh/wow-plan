wow_db:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Working database for the transforms. In the pipeline container this is scratch
      # (WOW_DUCKDB_PATH=/tmp/wow/wow.duckdb); on the host it stays in data/ for analysis.
      path: "{{ env_var('WOW_DUCKDB_PATH', '../data/wow.duckdb') }}"
      threads: 4
