version: 2

# Published tables, copied into Postgres schema `wow` by macros/publish_postgres.sql.
# meta.pg_primary_key becomes the PRIMARY KEY, meta.pg_indexes plain B-tree indexes.
# Tests between wago tables block the import; tests that cross from opendata (player caches of
# other builds) into wago data are severity: warn, since some links are expected to dangle.

models:
  - name: build_info
    description: One row about the live import - build, product, when its tables were fetched, opendata commit, row counts.
    config: { meta: { pg_primary_key: build } }

  - name: data_coverage
    description: Counts of items, quests, zones, dungeons, areas and recipes per level bracket (1-10 ... 51-60, over 60, no level), to spot gaps in a build's data.
    config: { meta: { pg_primary_key: bracket_order } }
    columns:
      - name: bracket_order
        data_tests: [unique, not_null]

  # world
  - name: maps
    description: Continents, dungeons, raids and battlegrounds (Map).
    config: { meta: { pg_primary_key: map_id } }
    columns:
      - name: map_id
        data_tests: [unique, not_null]

  - name: areas
    description: Every named place (AreaTable) with its parent, top-level zone and map.
    config: { meta: { pg_primary_key: area_id, pg_indexes: [name, zone_id, parent_area_id, map_id] } }
    columns:
      - name: area_id
        data_tests: [unique, not_null]
      - name: zone_id
        description: The top-level area this one sits in; equals area_id for a zone.
        data_tests: [not_null]

  - name: zones
    description: Top-level areas with a level range (from sub-area exploration levels or the seed) and counts.
    config: { meta: { pg_primary_key: zone_id, pg_indexes: [name, map_id, min_level, max_level] } }
    columns:
      - name: zone_id
        data_tests: [unique, not_null]
      - name: level_source
        data_tests:
          - accepted_values: { arguments: { values: [seed, exploration] } }

  - name: dungeons
    description: Dungeons and raids (LFGDungeons) with a seeded level range.
    config: { meta: { pg_primary_key: lfg_dungeon_id, pg_indexes: [name, map_id, min_level] } }
    columns:
      - name: lfg_dungeon_id
        data_tests: [unique, not_null]

  - name: taxi_nodes
    description: Flight masters (TaxiNodes), world coordinates.
    config: { meta: { pg_primary_key: taxi_node_id, pg_indexes: [map_id] } }
    columns:
      - name: taxi_node_id
        data_tests: [unique, not_null]

  - name: taxi_paths
    description: Direct flight legs between two flight masters, with the cost.
    config: { meta: { pg_primary_key: taxi_path_id, pg_indexes: [from_taxi_node_id, to_taxi_node_id] } }
    columns:
      - name: taxi_path_id
        data_tests: [unique, not_null]

  # reference
  - name: classes
    description: Playable classes (ChrClasses) and their bit in allowable_class_mask.
    config: { meta: { pg_primary_key: class_id } }
    columns:
      - name: class_id
        data_tests: [unique, not_null]

  - name: races
    description: Races (ChrRaces), playable and NPC, and their bit in allowable_race_mask.
    config: { meta: { pg_primary_key: race_id } }
    columns:
      - name: race_id
        data_tests: [unique, not_null]

  - name: class_race_combos
    description: Race/class pairs a player can create (CharBaseInfo), with the race's side (FactionTemplate).
    config: { meta: { pg_primary_key: combo_id, pg_indexes: [race_id, class_id, side] } }
    columns:
      - name: combo_id
        data_tests: [unique, not_null]
      - name: side
        data_tests:
          - not_null
          - accepted_values: { arguments: { values: [Alliance, Horde] } }

  - name: factions
    description: Reputation factions and faction groups (Faction).
    config: { meta: { pg_primary_key: faction_id, pg_indexes: [name, parent_faction_id] } }
    columns:
      - name: faction_id
        data_tests: [unique, not_null]

  - name: skill_lines
    description: Professions, secondary skills, weapon and armor skills, class trees (SkillLine).
    config: { meta: { pg_primary_key: skill_line_id, pg_indexes: [category_id, name] } }
    columns:
      - name: skill_line_id
        data_tests: [unique, not_null]

  - name: profession_ranks
    description: Trainer ranks (Apprentice to Artisan) with skill bounds and required character level (seed).
    config: { meta: { pg_primary_key: rank } }

  - name: item_sets
    description: Named item sets (ItemSet); item_ids is a JSON array.
    config: { meta: { pg_primary_key: item_set_id, pg_indexes: [name] } }
    columns:
      - name: item_set_id
        data_tests: [unique, not_null]

  - name: item_subclasses
    description: Item subclass names per item class. item_subclass_key = class * 100 + subclass.
    config: { meta: { pg_primary_key: item_subclass_key, pg_indexes: [item_class_id] } }
    columns:
      - name: item_subclass_key
        data_tests: [unique, not_null]

  # catalog
  - name: items
    description: >
      Every named item of the build (ItemSparse with hotfixes): class, slot, quality, binding, set,
      computed armor and weapon damage, and one column per stat type (seeds/ref_item_stat_types.csv).
      Stats use opendata's budget formula; spot-check them against in-game tooltips.
    config:
      meta:
        pg_primary_key: item_id
        pg_indexes: [name, quality, item_level, required_level, item_class_id, item_subclass_id, inventory_type,
                     item_set_id, stamina, spirit, intellect, agility, strength, armor, healing, spell_damage,
                     spell_power, attack_power]
    columns:
      - name: item_id
        data_tests: [unique, not_null]
      - name: name
        data_tests: [not_null]
      - name: item_set_id
        data_tests:
          - relationships: { arguments: { to: ref('item_sets'), field: item_set_id } }
      - name: faction_side
        data_tests:
          - accepted_values: { arguments: { values: [Alliance, Horde] } }
      - name: required_faction_id
        data_tests:
          - relationships: { arguments: { to: ref('factions'), field: faction_id }, config: { severity: warn } }

  - name: item_sources
    description: >
      Where an item comes from as far as client data says: crafted (recipes), quest reward or choice
      (opendata quests, only those seen), reputation standing (a faction reward; faction NULL when the
      build gives only the standing), PvP rank. No loot, vendor or world-drop rows: those are server-side.
    config: { meta: { pg_primary_key: item_source_id, pg_indexes: [item_id, kind, source_id, zone_id] } }
    columns:
      - name: item_source_id
        data_tests: [unique, not_null]
      - name: kind
        data_tests:
          - not_null
          - accepted_values: { arguments: { values: [crafted, quest_reward, quest_choice, reputation, pvp_rank] } }
      - name: item_id
        data_tests:
          - not_null
          - relationships: { arguments: { to: ref('items'), field: item_id } }

  - name: enchants
    description: >
      Enchant spells a player can get (SpellEffect 53 permanent / 54 temporary, SpellItemEnchantment):
      profession enchants and the items that apply one (scrolls, armor kits, stones, oils). effect_text is
      the line the enchanted item shows; applies_to the slots (SpellEquippedItems); taught_by the formula;
      item the applying item, whose required_level is the only level gate in client data.
    config: { meta: { pg_primary_key: enchant_spell_id, pg_indexes: [name, enchant_id, skill_line_id, item_id, taught_by_item_id] } }
    columns:
      - name: enchant_spell_id
        data_tests: [unique, not_null]
      - name: name
        data_tests: [not_null]
      - name: kind
        data_tests:
          - accepted_values: { arguments: { values: [permanent, temporary] } }
      - name: item_id
        data_tests:
          - relationships: { arguments: { to: ref('items'), field: item_id } }

  - name: item_stats
    description: One row per item and stat slot, with the budget inputs (value = round(budget_share x budget_points / 10000)).
    config: { meta: { pg_primary_key: item_stat_id, pg_indexes: [item_id, stat, stat_type_id] } }
    columns:
      - name: item_stat_id
        data_tests: [unique, not_null]

  - name: item_spells
    description: Spells an item casts or grants (Use, Equip, Chance on hit, Learn), with the spell text.
    config: { meta: { pg_primary_key: item_spell_id, pg_indexes: [item_id, spell_id] } }
    columns:
      - name: item_spell_id
        data_tests: [unique, not_null]

  - name: quests
    description: >
      Quests from players' client caches (opendata; only those someone has seen). zone_id is set for zone
      quests, quest_sort_id for category quests (class, profession, seasonal).
    config: { meta: { pg_primary_key: quest_id, pg_indexes: [name, zone_id, quest_sort_id, quest_level, min_level] } }
    columns:
      - name: quest_id
        data_tests: [unique, not_null]
      - name: zone_id
        data_tests:
          - relationships: { arguments: { to: ref('areas'), field: area_id }, config: { severity: warn } }

  - name: quest_items
    description: Items a quest asks for (objective) or gives (reward, choice).
    config: { meta: { pg_primary_key: quest_item_id, pg_indexes: [quest_id, item_id] } }
    columns:
      - name: quest_item_id
        data_tests: [unique, not_null]
      - name: role
        data_tests:
          - accepted_values: { arguments: { values: [objective, reward, choice] } }
      - name: item_id
        data_tests:
          - relationships: { arguments: { to: ref('items'), field: item_id }, config: { severity: warn } }

  - name: quest_npcs
    description: Creatures a quest asks you to kill or interact with.
    config: { meta: { pg_primary_key: quest_npc_id, pg_indexes: [quest_id, npc_id] } }
    columns:
      - name: quest_npc_id
        data_tests: [unique, not_null]

  - name: quest_reputation
    description: Reputation a quest awards, per faction.
    config: { meta: { pg_primary_key: quest_reputation_id, pg_indexes: [quest_id, faction_id] } }
    columns:
      - name: quest_reputation_id
        data_tests: [unique, not_null]
      - name: faction_id
        data_tests:
          - relationships: { arguments: { to: ref('factions'), field: faction_id }, config: { severity: warn } }

  - name: recipes
    description: >
      Crafting recipes (SkillLineAbility + SpellEffect + SpellReagents) with profession, thresholds and what
      it makes. skill_required is the client's minimum rank (usually 1); the skill a trainer asks for before
      teaching a recipe is server-side and not in client data. skill_green / skill_gray are the client's
      skill-up thresholds; yellow is not published.
    config: { meta: { pg_primary_key: recipe_spell_id, pg_indexes: [name, skill_line_id, skill_required, creates_item_id, taught_by_item_id] } }
    columns:
      - name: recipe_spell_id
        data_tests: [unique, not_null]
      - name: creates_item_id
        data_tests:
          - relationships: { arguments: { to: ref('items'), field: item_id } }

  - name: recipe_reagents
    description: One row per recipe or profession enchant and reagent (recipe_spell_id is either's spell).
    config: { meta: { pg_primary_key: recipe_reagent_id, pg_indexes: [recipe_spell_id, item_id] } }
    columns:
      - name: recipe_reagent_id
        data_tests: [unique, not_null]
      - name: item_id
        data_tests:
          - relationships: { arguments: { to: ref('items'), field: item_id }, config: { severity: warn } }

  - name: npcs
    description: Creatures from players' client caches (opendata; only those someone has seen).
    config: { meta: { pg_primary_key: npc_id, pg_indexes: [name] } }
    columns:
      - name: npc_id
        data_tests: [unique, not_null]

  - name: game_objects
    description: Game objects (chests, herbs, ore, doors, quest objects) from players' client caches (opendata).
    config: { meta: { pg_primary_key: object_id, pg_indexes: [name, required_skill_line_id] } }
    columns:
      - name: object_id
        data_tests: [unique, not_null]

  - name: spells
    description: Spells (SpellName, Spell, SpellMisc, SpellLevels) with school and skill resolved.
    config: { meta: { pg_primary_key: spell_id, pg_indexes: [name, skill_line_id] } }
    columns:
      - name: spell_id
        data_tests: [unique, not_null]
