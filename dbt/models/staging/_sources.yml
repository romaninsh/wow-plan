version: 2

sources:
  - name: wago
    description: >
      DB2 tables exported as CSV from wago.tools for one client build, hotfixes merged
      (refs/wago/<build>/, fetched by pipeline/pipeline.py fetch). Column names are the DB2 field
      names; *_lang columns are enUS text. The list must match pipeline/wago_tables.txt.
    meta:
      external_location: "read_csv('{{ var('wago_dir') }}/{{ var('wago_build') }}/{name}.csv', header=true, sample_size=-1)"
    tables:
      - name: Item
      - name: ItemSparse
      - name: ItemSearchName
      - name: ItemEffect
      - name: ItemXItemEffect
      - name: ItemSet
      - name: ItemClass
      - name: ItemSubClass
      - name: RandPropPoints
      - name: ItemArmorQuality
      - name: ItemArmorTotal
      - name: ItemArmorShield
      - name: ArmorLocation
      - name: ItemDamageOneHand
      - name: ItemDamageOneHandCaster
      - name: ItemDamageTwoHand
      - name: ItemDamageTwoHandCaster
      - name: ItemDamageRanged
      - name: ItemDamageThrown
      - name: ItemDamageAmmo
      - name: SpellName
      - name: Spell
      - name: SpellLevels
      - name: SpellMisc
      - name: SpellCastTimes
      - name: SpellEffect
      - name: SpellReagents
      - name: SpellTotems
      - name: SkillLineAbility
      - name: SkillLine
      - name: AreaTable
      - name: Map
      - name: UiMap
      - name: UiMapAssignment
      - name: LFGDungeons
      - name: ContentTuning
      - name: TaxiNodes
      - name: TaxiPath
      - name: ChrClasses
      - name: ChrRaces
      - name: CharBaseInfo
      - name: FactionTemplate
      - name: Faction
      - name: QuestSort
      - name: QuestInfo
      - name: CreatureType
      - name: CreatureFamily

  - name: opendata
    description: >
      Client-cache JSON Lines from github.com/wowlayerup-forever/opendata (refs/opendata): quests,
      creatures and game objects some player's client has seen. Not in DB2 on this engine. CC BY 4.0.
    meta:
      external_location: "read_json_auto('{{ var('opendata_dir') }}/{name}.jsonl', sample_size=-1)"
    tables:
      - name: quests
      - name: npcs
      - name: objects
