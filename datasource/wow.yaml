# yaml-language-server: $schema=./datasource-schema-1.json
type: postgres
description: >
  WoW Forever reference data for one client build (schema wow), rebuilt by the Import build
  action from wago.tools and opendata. Read-only by convention: every import replaces it whole.
# The active profile's env file (.env, .env.prod) names the server; see .env.example.
url: ${secret.wow_url}
