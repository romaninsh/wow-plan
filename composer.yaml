# Services Vantage runs for this project (the Services indicator in the title bar).
# Standard compose schema: `docker compose -f composer.yaml up -d` drives the same stack.
# `127.0.0.1::<port>` = loopback-only and an ephemeral host port; datasources address the
# service name (`postgres:5432`) and Vantage rewrites it to the port docker picked.
services:
  # Reference data: one Forever client build, rebuilt by the Import build action.
  # Live tables are in schema `wow`; `wow_prev` is the previous import (rollback).
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wow
      POSTGRES_PASSWORD: wow
      POSTGRES_DB: wow
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wow -d wow"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

  # Guides (later).
  mongo:
    image: mongo:7
    command: --quiet
    ports:
      - "127.0.0.1::27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

  # One-shot data pipeline, behind a profile so a plain `up` never runs it. The Fetch build
  # and Import build actions run:
  #   docker compose -f composer.yaml --profile pipeline run --rm --no-deps pipeline <fetch|import> <build>
  # It sees only these mounts: dbt/ and seeds/ read-only, refs/ for downloads. dbt's target,
  # logs and the DuckDB working file stay inside the container.
  pipeline:
    profiles: [pipeline]
    build: pipeline
    volumes:
      - ./dbt:/work/dbt:ro
      - ./seeds:/work/seeds:ro
      - ./pipeline:/work/pipeline:ro
      - ./refs:/work/refs
    environment:
      WOW_PG_URL: postgresql://wow:wow@postgres:5432/wow
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
