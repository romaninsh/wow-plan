# yaml-language-server: $schema=./action-schema-1.json
#
# The padlock's Unlock on the plan page. The server compares hash_secret(key) with the stored
# edit_code_hash; on a match it adds the plan to this session's `plans` list, and the plans
# datasource's rule then lets this session change that plan until it locks it again
# (lock_plan), the key is replaced (rotate_edit_key) or the session ends. A wrong key changes
# nothing. Rate-limited per session and per address: keys are 4 characters.
kind: script
description: >
  Unlock a plan for editing in this session with the plan's edit key (4 characters, from
  whoever made the plan). Until then every change to the plan is refused. Takes plan_id (the
  7-character id in the plan's link) and key. Returns { unlocked: true, url }, url being the
  plan's page to give the player; a wrong key is an error. Rate-limited: five tries, then one
  every 5 seconds.
rate_limit: { per_second: 0.2, burst: 5 }
params:
  plan_id: { type: string }
  key: { type: string }
dialog:
  title: Unlock plan
body: |
  let plan_id = if args.plan_id == () { "" } else { `${args.plan_id}` };
  let key = if args.key == () { "" } else { `${args.key}` };
  key.trim();
  let plan = if plan_id == "" { () } else { table("plan").get(plan_id) };
  if plan == () { fail("There is no such plan"); }
  if key == "" || plan.edit_code_hash == () || hash_secret(key) != plan.edit_code_hash {
    fail("That key doesn't unlock this plan");
  }
  session.add("plans", plan_id);
  let out = #{ unlocked: true };
  if is_def_var("request") && request.origin != () { out.url = `${request.origin}/p/${plan_id}`; }
  out
