# yaml-language-server: $schema=./action-schema-1.json
#
# Reloads the sample plans of the active profile's target, and nothing else:
# mongo/guides.sh <target> samples runs mongo/seed.js, which deletes and re-inserts only the
# plans it lists (marked `sample: true`) with their characters, brackets and to-dos. Plans users
# made are never touched; more samples are added to the list in seed.js. The schema and views
# are a separate action (update_guides_schema). Called as
# actions.reset_sample_plans(#{ target: profile.target }).
kind: terminal
description: |
  Reload the sample plans on target "${row.target}" (House of Grr, its clone, Grak the
  patient). Edits made to those plans are lost; every other plan is kept.
dialog:
  title: "Reset sample plans on ${row.target}"
terminal:
  command: sh
  args: ["mongo/guides.sh", "${row.target}", "samples"]
