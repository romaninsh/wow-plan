# yaml-language-server: $schema=./action-schema-1.json
#
# Applies mongo/schema.js (validators, indexes) and reloads the sample plans from mongo/seed.js
# inside the running mongo container (composer.yaml mounts mongo/ at /scripts). Only the sample
# plans are replaced; other plans stay.
kind: terminal
description: |
  Re-apply the guides schema and reload the three sample plans (House of Grr, its clone, and a
  solo hunter). Other plans are kept. Needs the services running.
dialog:
  title: "Reset sample plans"
terminal:
  command: docker
  args:
    - compose
    - -f
    - composer.yaml
    - exec
    - -T
    - mongo
    - sh
    - -c
    - >-
      mongosh "mongodb://localhost:27017/wowplan?directConnection=true" --quiet --file /scripts/schema.js &&
      mongosh "mongodb://localhost:27017/wowplan?directConnection=true" --quiet --file /scripts/seed.js
