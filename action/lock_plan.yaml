# yaml-language-server: $schema=./action-schema-1.json
#
# The padlock's Lock: takes the plan off this session's `plans` list. Returns #{ unlocked: false }.
kind: script
description: >
  Lock a plan again in this session: its changes are refused until it is unlocked with its edit
  key. Other sessions that unlocked it stay unlocked. Takes plan_id. Returns { unlocked: false }.
params:
  plan_id: { type: string }
dialog:
  title: Lock plan
body: |
  let plan_id = if args.plan_id == () { "" } else { `${args.plan_id}` };
  if plan_id != "" { session.remove("plans", plan_id); }
  #{ unlocked: false }
