# yaml-language-server: $schema=./action-schema-1.json
#
# PARKED: not in api/wowplan.yaml until Vantage has anonymous sessions (agents/BRIEF.md
# "Sessions and unlock"); with a write rule guarding by grant, a plain record write may replace it.
#
# The web app's edit: tick a to-do done, or open it again. Args: target_id, done: true|false.
# Refused unless this session unlocked the to-do's plan (unlock_plan): the check is here, on the
# server, whatever the page shows. A to-do is done once for the whole plan (tick_target, the
# desktop's version, does the same without the session check). Returns #{ id, done }.
kind: script
dialog:
  title: Tick to-do
body: |
  let target_id = if args.target_id == () { "" } else { `${args.target_id}` };
  let t = if target_id == "" { () } else { table("plan_target").get(target_id) };
  if t == () { throw "That to-do doesn't exist (any more)"; }
  let list = session.unlocked ?? "";
  if !list.contains(`,${t.plan_id},`) { throw "This plan is locked: unlock it with its edit key first"; }
  if type_of(args.done) != "bool" { throw "Say whether the to-do is done: true or false"; }
  let done = args.done;
  table("plan_target").patch(t._id, #{ done: done, done_at: if done { `${now()}` } else { () } });
  table("plan").patch(t.plan_id, #{ updated_at: `${now()}` });
  #{ id: t._id, done: done }
