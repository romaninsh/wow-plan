# yaml-language-server: $schema=./action-schema-1.json
#
# The web app's tick: a to-do done, or open again. A to-do is done once for the whole plan
# (tick_target, the desktop's version, does the same). The plans datasource's rule refuses it
# unless this session unlocked the to-do's plan (unlock_plan). Returns #{ id, done }.
kind: script
description: >
  Mark one of a plan's to-dos (targets) done, or open it again; the time it was done is
  stored. A to-do is done once for the whole plan, whoever it is for. Needs the plan unlocked
  in this session (unlock_plan). Takes target_id and done (true or false). Returns { id, done }.
rate_limit: { per_second: 1, burst: 20 }
params:
  target_id: { type: string }
  done: { type: bool }
dialog:
  title: Tick to-do
body: |
  let target_id = if args.target_id == () { "" } else { `${args.target_id}` };
  let t = if target_id == "" { () } else { table("plan_target").get(target_id) };
  if t == () { fail("That to-do doesn't exist (any more)"); }
  if type_of(args.done) != "bool" { fail("Say whether the to-do is done (true or false)"); }
  let done = args.done;
  table("plan_target").patch(t._id, #{ done: done, done_at: if done { `${now()}` } else { () } });
  table("plan").patch(t.plan_id, #{ updated_at: `${now()}` });
  #{ id: t._id, done: done }
