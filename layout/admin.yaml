# yaml-language-server: $schema=./layout-schema-1.json
#
# The admin window: the usual menu (menu/left.yaml), and pages in a stack like a mobile app.
# A page opened from a page goes on top; the header shows Back and the breadcrumbs
# (Plans › House of Grr › To-dos), and a crumb goes back to its page. A menu click starts a new
# trail; opening a page already in the trail (same page and args) goes back to it.
regions:
  title_bar: { view: title_bar }
  left: { nav: menu, source: { menu: left }, header: project_switcher, footer: project_settings }
  main: { host: stack, header: data_banner, empty: dashboard }
  status:
    - { id: view, text: 'view.text', dim: '!view.active' }
